# Quarkus

quarkus.application.name=autostox

quarkus.banner.enabled=false

quarkus.devservices.enabled=false

quarkus.http.port=8080
quarkus.http.root-path=/api

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

# Quarkus Cache

quarkus.cache.caffeine."exchange-rates".expire-after-write=1H
quarkus.cache.caffeine."exchange-rates".maximum-size=100
quarkus.cache.caffeine."instruments".expire-after-write=24H
quarkus.cache.caffeine."instruments".maximum-size=1000
quarkus.cache.caffeine."candles".expire-after-write=30M
quarkus.cache.caffeine."candles".maximum-size=2000
quarkus.cache.caffeine."candles-intraday".expire-after-write=1S
quarkus.cache.caffeine."candles-intraday".maximum-size=1000
quarkus.cache.caffeine."quotes".expire-after-write=1S
quarkus.cache.caffeine."quotes".maximum-size=1000

# Quarkus OpenAPI

quarkus.smallrye-openapi.info-title=autostox API
quarkus.smallrye-openapi.info-description=autostox
quarkus.swagger-ui.always-include=true

# Frankfurter (ECB reference rates)

quarkus.rest-client.frankfurter.url=https://api.frankfurter.dev/v2

# Alpaca

alpaca.api-key-id=${ALPACA_API_KEY_ID:placeholder}
alpaca.api-secret-key=${ALPACA_API_SECRET_KEY:placeholder}
alpaca.feed=${ALPACA_FEED:iex}
alpaca.trading-environment=${ALPACA_TRADING_ENVIRONMENT:paper}
